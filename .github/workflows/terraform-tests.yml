name: Terraform EKS Module Tests

on:
  push:
    branches: [ main ]
    paths:
      - '**/*.tf'
      - '**/*.tpl'
      - '**/*.tftest.hcl'
      - '.github/workflows/terraform-tests.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '**/*.tf'
      - '**/*.tpl'
      - '**/*.tftest.hcl'
      - '.github/workflows/terraform-tests.yml'

jobs:
  validate:
    name: Validate Terraform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.3.2

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  test-plan:
    name: Test Terraform Plan
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.3.2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Initialize Test Directory
        run: |
          cd test
          terraform init

      - name: Run Basic Tests (Plan Only)
        run: |
          cd test
          terraform test -filter=validate_cluster_creation -no-color

  test-basic:
    name: Run Basic Tests
    runs-on: ubuntu-latest
    needs: test-plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.3.2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Initialize Test Directory
        run: |
          cd test
          terraform init

      - name: Run Basic Tests
        run: |
          cd test
          chmod +x run_tests.sh
          ./run_tests.sh basic

      - name: Upload Test Report
        uses: actions/upload-artifact@v3
        with:
          name: test-report
          path: test/results/

  test-advanced:
    name: Run Advanced Tests
    runs-on: ubuntu-latest
    needs: test-basic
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.3.2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Initialize Test Directory
        run: |
          cd test
          terraform init

      - name: Run Advanced Tests
        run: |
          cd test
          chmod +x run_tests.sh
          ./run_tests.sh advanced

      - name: Upload Test Report
        uses: actions/upload-artifact@v3
        with:
          name: test-report-advanced
          path: test/results/

  cleanup:
    name: Cleanup Test Resources
    runs-on: ubuntu-latest
    needs: [test-basic, test-advanced]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.3.2

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-west-2

      - name: Cleanup Resources
        run: |
          cd test
          terraform destroy -auto-approve